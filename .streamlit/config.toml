# ADF → Fabric Studio theme: light surfaces with a blue to violet accent (the palette of the Synapse accelerator UI).
[theme]
base = "light"
primaryColor = "#2f6fec"
backgroundColor = "#f4f6fb"
secondaryBackgroundColor = "#f7f9fd"
textColor = "#172033"
borderColor = "#e1e6f0"
font = "sans-serif"
baseRadius = "10px"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
