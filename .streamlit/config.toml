# ADF → Fabric Studio theme: light surfaces with emerald / cyan accents.
[theme]
base = "light"
primaryColor = "#047857"
backgroundColor = "#f5f7fa"
secondaryBackgroundColor = "#f1f4f8"
textColor = "#0f172a"
borderColor = "#e2e8f0"
font = "sans-serif"
baseRadius = "10px"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
