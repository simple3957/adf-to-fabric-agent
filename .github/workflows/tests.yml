name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[api,ui,dev]"
      - run: python -m pytest -q
      - name: Known-vulnerability scan of the installed dependencies
        run: pip install pip-audit && pip-audit --skip-editable
